name: natgas_event_outright_v1_storage_boost_2x
data_config: config/data.yaml

instrument:
  symbol: NG
  exchange: NYMEX
  currency: USD
  multiplier: 10000
  tick_size: 0.001
  tick_value: 10.0
  backtest_price_col: ng1_settle
  cost_turnover_multiplier: 1.0

roll:
  method: expiration_days_before
  business_days_before_expiration: 2

features:
  storage_baseline_years: 5
  weather_baseline_years: 10
  realized_vol_window: 20
  riskoff_percentile_window: 252
  riskoff_percentile: 0.90

signals:
  model: event_outright_v1
  allow_longs: true
  allow_shorts: true
  max_holding_days: 0
  exit_score: 0.25
  event_entry_score: 1.50
  long_event_entry_score: 2.50
  short_event_entry_score: 2.00
  reversion_entry_score: 1.25
  long_reversion_entry_score: 1.75
  short_reversion_entry_score: 1.00
  weather_anomaly_threshold: 1.00
  weather_change_threshold: 1.00
  storage_surprise_threshold: 50.0
  curve_confirm_threshold: 0.025
  curve_lookback_days: 3
  weather_weight: 0.75
  weather_change_weight: 1.00
  storage_surprise_weight: 0.60
  curve_weight: 0.75
  storage_entry_mode: confirm_boost
  event_direction: fade
  reversion_weather_threshold: 1.50
  reversion_change_threshold: 0.75
  profit_protection_trigger: 0.15
  profit_giveback: 0.05
  allow_storage_only_events: false
  allow_combined_storage_longs: true
  allow_combined_storage_shorts: true
  weak_long_min_contracts: 1
  weak_long_max_contracts: 1
  strong_long_min_contracts: 3
  strong_long_max_contracts: 5
  weak_short_min_contracts: 0
  weak_short_max_contracts: 3
  strong_short_min_contracts: 0
  strong_short_max_contracts: 5
  max_component_abs: 2.0

sizing:
  initial_equity: 1000000.0
  position_scale: 2.0
  target_vol: 0.06
  max_contracts: 5
  max_long_contracts: 5
  max_short_contracts: 5
  max_notional_leverage: 0.75
  min_realized_vol: 0.20

costs:
  commission_per_contract: 2.50
  slippage_ticks: 1.0
